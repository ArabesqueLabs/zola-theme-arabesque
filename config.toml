# The theme's demo site: every template, in English and Arabic.
# Run it with `zola serve` here. To use the theme in your own site, see the README.

base_url = "https://arabesquelabs.github.io/zola-theme-arabesque"
title = "Arabesque for Zola"
description = "A calm, accessible Zola theme in English and Arabic, built on the Arabesque design system."
author = "Arabesque Labs"
default_language = "en"

compile_sass = false
generate_feeds = true
feed_filenames = ["atom.xml"]
build_search_index = true

taxonomies = [
  { name = "tags", paginate_by = 10, feed = true },
]

[markdown]
highlight_code = true
# The theme colours code with the system's syntax roles (theme.css):
highlight_theme = "css"
smart_punctuation = true
external_links_no_referrer = true

[search]
index_format = "fuse_json"

[languages.ar]
title = "آرابيسك لـ Zola"
description = "قالب هادئ وسهل الوصول لـ Zola بالعربية والإنجليزية، مبني على نظام التصميم آرابيسك."
generate_feeds = true
feed_filenames = ["atom.xml"]
build_search_index = true
taxonomies = [
  { name = "tags", paginate_by = 10, feed = true },
]

[languages.ar.search]
index_format = "fuse_json"

# The theme's settings. A site that uses the theme gets these from
# theme.toml and sets only what differs; this site *is* the theme, so it
# repeats them all (Zola merges theme.toml's [extra] only into a site that
# names a theme). Keep them in step with theme.toml.
[extra]

# Languages written right to left: <html dir="rtl"> for these.
rtl_languages = ["ar", "fa", "he", "ur", "ps", "ckb", "sd", "ug", "yi", "dv"]

# The header's links, per language: name, and url as an internal link
# ("@/blog/_index.md"), a path ("/tags/") or an address.
#   [[extra.menu.en]]
#   name = "Blog"
#   url = "@/blog/_index.md"
[extra.menu]

# Each language named in itself, for the language link ("العربية", "English").
[extra.language_names]
en = "English"
ar = "العربية"

# The language link shows the other language's own letter, in a key: set one
# per language (a language without one shows the translate icon).
[extra.language_glyphs]
en = "En"
ar = "ع"

[extra.header]
# An image beside the site's title in the header (a path in static/), or "".
logo = "arabesque/theme/logo.svg"
# Keep the header at the top of the window as the page scrolls.
sticky = true
# Show the theme button, which cycles through system, light and dark.
theme_toggle = true
# Show the language link, when the site has more than one language.
language_link = true

# One action that stays in the bar at every width, per language:
#   [extra.header.action.en]
#   name = "Subscribe"
#   url = "@/subscribe.md"
[extra.header.action]

[extra.home]
# The section whose latest pages the home page lists ("blog/_index.md"),
# or "" for none. It must exist, in every language.
section = "blog/_index.md"
# How many of them.
count = 5
# Draw the pattern across the hero (js/pattern.js), with its focal tile.
pattern = true
# Let the hero's pattern draw itself in once on load (never under reduced motion).
animate = true

[extra.page]
# Show "On this page" beside a page with at least this many h2 headings;
# 0 turns it off. A page can override it with `extra.toc = true/false`.
toc_min_headings = 4
# Show the reading time beside the date.
reading_time = true
# Show links to the newer and older page at the foot of a page in a sorted section.
page_nav = true
# Show "Back to top" once the page has scrolled this many screens.
back_to_top_after = 0.5

[extra.search]
# A page that uses templates/search.html (see the README), as an internal
# link ("@/search.md"), or "" for no search. Needs `build_search_index = true`
# and `[search] index_format = "fuse_json"` in config.toml.
page = "@/search.md"

[extra.social]
# Tags that describe each page to the sites and apps that preview links:
# Open Graph (Facebook, LinkedIn, Slack, Discord, Mastodon…), X's cards, and
# schema.org data for search engines. With nothing else set, they use each
# page's title, description, date, tags, authors and image, then the site's.
enabled = true
# The image shown with a link to a page that has none of its own (`image`
# under a page's [extra]): a path in static/ or an address, best at
# 1200×630; "" for none. A page's own alt text is `image_alt` beside `image`.
image = ""
# What the image shows, for people who can't see it.
image_alt = ""
# The site's X (Twitter) account, and the author's, as "@name".
twitter_site = ""
twitter_creator = ""
# The author's fediverse account, as "@name@example.social": Mastodon
# credits them on links to the site.
fediverse_creator = ""
# schema.org data (JSON-LD): the site on the home page, a blog post for each
# dated page, a web page for the rest.
schema_org = true
# Who publishes the site, for schema.org: "Person" or "Organization". It's
# named by `extra.author`, then `author`, then the site's title.
publisher_type = "Organization"
# Your profiles elsewhere, for schema.org's sameAs:
#   same_as = ["https://github.com/you", "https://example.social/@you"]
same_as = ["https://github.com/ArabesqueLabs"]

[extra.footer]
# Show the site's name (and logo) in the footer; the header already has it.
lockup = false
# Show "Built with Zola and the Arabesque design system."
credit = false
# Link to the Atom feed (an icon after the footer's links), when one is generated.
feed_link = true

# Links in the footer, per language, as the header's menu; with an icon
# ("github", "feed", or any of the design system's), a link is that icon,
# named by its name:
#   [[extra.footer.links.en]]
#   name = "Privacy"
#   url = "@/privacy.md"
[extra.footer.links]

# A line under the copyright, per language (Markdown isn't rendered; HTML is kept):
#   [extra.footer.text]
#   en = "Written in London."
[extra.footer.text]
en = 'Made with ♥ by <a href="https://mosab.co.uk">Mosab</a> at <a href="https://arabesquelabs.com">Arabesque Labs</a>'
ar = 'صُنع بـ ♥ على يد <a href="https://mosab.co.uk">مصعب</a> في <a href="https://arabesquelabs.com">معامل آرابيسك</a>'

# The copyright line in place of the theme's ("© %year %name."), per language;
# HTML is kept, and %year and %name are filled in.
[extra.footer.copyright]
en = 'A <a href="https://www.getzola.org" lang="en">Zola</a> theme using <a href="https://design.arabesquelabs.com">Arabesque design system</a> · Released under the <a href="https://github.com/ArabesqueLabs/zola-theme-arabesque/blob/main/LICENSE">MIT license</a>'
ar = 'قالب <a href="https://www.getzola.org" lang="en">Zola</a> يستخدم <a href="https://design.arabesquelabs.com">نظام التصميم آرابيسك</a> · منشور بموجب <a href="https://github.com/ArabesqueLabs/zola-theme-arabesque/blob/main/LICENSE">رخصة MIT</a>'

