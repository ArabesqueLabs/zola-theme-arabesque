# Builds the demo site (this repository) and publishes it on GitHub Pages.
# Pull requests are built, to check them, but not published.
#
# Once, in the repository's Settings → Pages: set Source to "GitHub Actions".

name: Demo on GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push doesn't cancel one that's running.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.19.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        run: |
          curl -sSfL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin zola
          zola --version

      - name: Find the Pages address
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      # Fails on a broken internal link (@/…) too.
      - name: Build
        run: zola build --base-url "${BASE_URL:-https://example.com}"
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
