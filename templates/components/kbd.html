{#- Keys to press (components/kbd): {{ <kbd keys="Ctrl+K" /> }}, each key in its own box. -#}
{%- component kbd(keys: string) -%}
<span class="al-nowrap" dir="ltr">{% for key in keys | split(pat="+") %}<kbd class="al-kbd">{{ key | escape }}</kbd>{% if not loop.last %}+{% endif %}{% endfor %}</span>
{%- endcomponent kbd -%}
