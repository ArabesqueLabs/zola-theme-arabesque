{#- What someone said (components/card, quote), in their words:
    {% quote(name="Lina Haddad", role="Designer, Example Ltd") %}Their words.{% end %} -#}
<figure class="al-quote zt-quote">
  <blockquote>{{ body | markdown | safe }}</blockquote>
  {%- if name is defined %}
  <figcaption class="al-quote__by">
    <span><span class="al-quote__name">{{ name }}</span>{% if role is defined %}<span class="al-quote__role">{{ role }}</span>{% endif %}</span>
  </figcaption>
  {%- endif %}
</figure>
